<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 230" width="100%" height="100%" fill="none" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Left highlight facet -->
    <linearGradient id="emblemGoldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF9F2" />
      <stop offset="30%" stop-color="#EADBBA" />
      <stop offset="70%" stop-color="#D4B988" />
      <stop offset="100%" stop-color="#C29F64" />
    </linearGradient>
    <!-- Right shade facet -->
    <linearGradient id="emblemGoldRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2CCA5" />
      <stop offset="40%" stop-color="#C8A261" />
      <stop offset="75%" stop-color="#A68040" />
      <stop offset="100%" stop-color="#7A5A24" />
    </linearGradient>
    <!-- Top Bar gradient -->
    <linearGradient id="emblemGoldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4B988" />
      <stop offset="25%" stop-color="#FCF9F2" />
      <stop offset="50%" stop-color="#EADBBA" />
      <stop offset="75%" stop-color="#D4B988" />
      <stop offset="100%" stop-color="#B6904E" />
    </linearGradient>
  </defs>

  <!-- Left Facet of Emblem -->
  <path d="M 0 0 
           L 110 0 
           L 110 60 
           L 109 155 
           A 7 7 0 0 0 109 169 
           L 109 228 
           L 110 228 
           C 98 196, 76 168, 76 160 
           C 76 148, 88 138, 88 126 
           L 88 38 
           C 88 28, 80 25, 60 25 
           C 30 25, 0 35, 0 48 
           Z" 
        fill="url(#emblemGoldLeft)" />

  <!-- Right Facet of Emblem -->
  <path d="M 110 0 
           L 220 0 
           L 220 48 
           C 220 35, 190 25, 160 25 
           C 140 25, 132 28, 132 38 
           L 132 126 
           C 132 138, 144 148, 144 160 
           C 144 168, 122 196, 110 228 
           L 111 228 
           L 111 169 
           A 7 7 0 0 0 111 155 
           L 111 60 
           L 110 0 
           Z" 
        fill="url(#emblemGoldRight)" />

  <!-- Center Slit & Breather Hole Accent -->
  <line x1="110" y1="60" x2="110" y2="155" stroke="rgba(3, 30, 23, 0.9)" stroke-width="2" />
  <circle cx="110" cy="162" r="7" fill="rgba(3, 30, 23, 0.9)" />
  <line x1="110" y1="169" x2="110" y2="228" stroke="rgba(3, 30, 23, 0.9)" stroke-width="2" />

  <!-- Top Bar chiseled accent line -->
  <path d="M 0 0 L 220 0 L 220 4.5 L 0 4.5 Z" fill="url(#emblemGoldBar)" opacity="0.85" />
</svg>